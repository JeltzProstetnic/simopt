[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simopt"
version = "0.1.0"
description = "Build, validate, run and optimise SimOpt simulation models from Python, through the SimOpt MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See LICENSE.md in the SimOpt repository" }
dependencies = []

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest"]

[tool.setuptools]
packages = ["simopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
